<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset=".5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ca3af"/>
      <stop offset="1" stop-color="#6b7280"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#fde68a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7cc"/>
      <stop offset=".4" stop-color="#facc15" stop-opacity=".8"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tiles" width="80" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 0H80V60" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Wall and floor -->
  <rect width="1920" height="600" fill="url(#wall)"/>
  <rect width="1920" height="540" fill="url(#tiles)"/>
  <rect y="540" width="1920" height="60" fill="url(#floor)"/>
  <rect y="538" width="1920" height="4" fill="#475569"/>

  <!-- Overhead pipes with valve and gauge -->
  <rect x="0" y="40" width="1920" height="26" rx="13" fill="url(#pipe)"/>
  <rect x="0" y="86" width="1100" height="16" rx="8" fill="url(#pipe)" opacity=".8"/>
  <rect x="1088" y="86" width="16" height="140" rx="8" fill="url(#pipe)" opacity=".8"/>
  <g fill="#475569">
    <rect x="300" y="34" width="14" height="38" rx="3"/>
    <rect x="760" y="34" width="14" height="38" rx="3"/>
    <rect x="1220" y="34" width="14" height="38" rx="3"/>
    <rect x="1680" y="34" width="14" height="38" rx="3"/>
  </g>
  <g transform="translate(520 94)">
    <circle r="30" fill="none" stroke="#dc2626" stroke-width="7"/>
    <path d="M-30 0H30M0 -30V30" stroke="#dc2626" stroke-width="5"/>
    <circle r="7" fill="#991b1b"/>
  </g>
  <g transform="translate(1096 250)">
    <circle r="30" fill="#e2e8f0" stroke="#64748b" stroke-width="5"/>
    <path d="M-18 8A20 20 0 0 1 18 8" fill="none" stroke="#16a34a" stroke-width="5"/>
    <path d="M0 0L14 -14" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
    <circle r="4" fill="#111827"/>
  </g>

  <!-- Hanging work lamp over the panel -->
  <path d="M1600 66V120" stroke="#475569" stroke-width="3"/>
  <path d="M1570 120H1630L1645 145H1555Z" fill="#16a34a"/>
  <path d="M1555 145L1380 540H1830L1645 145Z" fill="url(#lamp)"/>

  <!-- Left: toolbox, ladder and spare parts -->
  <g transform="translate(120 330)">
    <path d="M10 0L20 -60H150L160 0" fill="none" stroke="#94a3b8" stroke-width="8"/>
    <g stroke="#94a3b8" stroke-width="10" stroke-linecap="round">
      <path d="M40 -60L-10 210"/>
      <path d="M130 -60L180 210"/>
    </g>
    <g stroke="#94a3b8" stroke-width="7">
      <path d="M30 0H140M18 60H152M7 120H163M-4 180H174"/>
    </g>
  </g>
  <g transform="translate(330 470)">
    <rect width="190" height="70" rx="6" fill="#dc2626"/>
    <rect y="-14" width="190" height="20" rx="4" fill="#b91c1c"/>
    <path d="M65 -14V-34H125V-14" fill="none" stroke="#15803d" stroke-width="8" stroke-linejoin="round"/>
    <rect x="85" y="18" width="20" height="12" rx="2" fill="#fde68a"/>
    <path d="M150 -20L210 -70" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
    <circle cx="214" cy="-74" r="12" fill="none" stroke="#cbd5e1" stroke-width="7"/>
  </g>
  <g transform="translate(600 498)">
    <rect width="60" height="42" rx="4" fill="#15803d"/>
    <rect x="70" y="10" width="44" height="32" rx="4" fill="#475569"/>
    <circle cx="92" cy="26" r="9" fill="#94a3b8"/>
  </g>

  <!-- Right: open electrical panel -->
  <g transform="translate(1580 170)">
    <rect width="230" height="300" rx="8" fill="url(#panel)" stroke="#4b5563" stroke-width="4"/>
    <rect x="16" y="16" width="198" height="268" rx="4" fill="#1f2937"/>
    <g fill="#e5e7eb">
      <rect x="34" y="40" width="34" height="56" rx="3"/>
      <rect x="78" y="40" width="34" height="56" rx="3"/>
      <rect x="122" y="40" width="34" height="56" rx="3"/>
      <rect x="166" y="40" width="34" height="56" rx="3"/>
      <rect x="34" y="120" width="34" height="56" rx="3"/>
      <rect x="78" y="120" width="34" height="56" rx="3"/>
      <rect x="122" y="120" width="34" height="56" rx="3"/>
      <rect x="166" y="120" width="34" height="56" rx="3"/>
    </g>
    <g fill="#16a34a">
      <rect x="44" y="52" width="14" height="18" rx="2"/>
      <rect x="88" y="52" width="14" height="18" rx="2"/>
      <rect x="176" y="52" width="14" height="18" rx="2"/>
      <rect x="44" y="132" width="14" height="18" rx="2"/>
      <rect x="132" y="132" width="14" height="18" rx="2"/>
      <rect x="176" y="132" width="14" height="18" rx="2"/>
    </g>
    <g fill="#dc2626">
      <rect x="132" y="70" width="14" height="18" rx="2"/>
      <rect x="88" y="150" width="14" height="18" rx="2"/>
    </g>
    <g fill="none" stroke-width="6" stroke-linecap="round">
      <path d="M50 284C50 240 60 220 51 176" stroke="#dc2626"/>
      <path d="M95 284C95 250 110 220 95 176" stroke="#16a34a"/>
      <path d="M139 284C139 250 125 220 139 176" stroke="#facc15"/>
      <path d="M183 284C183 240 175 220 183 176" stroke="#3b82f6"/>
    </g>
    <!-- Open door -->
    <path d="M230 0L300 -26V326L230 300Z" fill="#9ca3af" stroke="#4b5563" stroke-width="4"/>
    <rect x="262" y="140" width="10" height="40" rx="3" fill="#374151"/>
    <!-- Warning label -->
    <path d="M265 40L285 76H245Z" fill="#facc15" stroke="#111827" stroke-width="2"/>
    <path d="M265 52V64" stroke="#111827" stroke-width="3"/>
  </g>
  <circle cx="1678" cy="291" r="24" fill="url(#spark)"/>

  <!-- Technician (facing right, working on the panel) -->
  <g transform="translate(1400 0)">
    <!-- Back arm (holding torch) -->
    <path d="M118 262C150 280 170 310 196 316" fill="none" stroke="#b91c1c" stroke-width="30" stroke-linecap="round"/>
    <circle cx="204" cy="316" r="13" fill="#5b3420"/>
    <rect x="200" y="302" width="40" height="18" rx="5" fill="#111827" transform="rotate(-12 200 302)"/>
    <path d="M240 300L300 280L300 330Z" fill="#fde68a" opacity=".25"/>

    <!-- Legs -->
    <path d="M70 400L62 520" stroke="#15803d" stroke-width="44" stroke-linecap="round"/>
    <path d="M118 400L136 520" stroke="#166534" stroke-width="44" stroke-linecap="round"/>
    <!-- Red knee patches -->
    <rect x="44" y="448" width="40" height="30" rx="8" fill="#dc2626"/>
    <rect x="110" y="448" width="40" height="30" rx="8" fill="#b91c1c" transform="rotate(-8 130 463)"/>
    <!-- Boots -->
    <path d="M36 516H92Q100 516 102 530V542H34Q30 528 36 516Z" fill="#111827"/>
    <path d="M114 516H166Q182 520 184 534V542H112Z" fill="#111827"/>

    <!-- Torso: green coverall with red side panels -->
    <path d="M44 250Q46 228 70 222H122Q146 228 148 250L152 410H40Z" fill="#16a34a"/>
    <path d="M44 250Q46 228 70 222H78L66 410H40Z" fill="#dc2626"/>
    <path d="M148 250Q146 228 122 222H116L130 410H152Z" fill="#b91c1c"/>
    <!-- Collar and zip -->
    <path d="M78 222L96 248L114 222" fill="#15803d" stroke="#14532d" stroke-width="3"/>
    <path d="M96 248V400" stroke="#14532d" stroke-width="3" stroke-dasharray="6 5"/>
    <!-- Chest pocket with pen -->
    <rect x="102" y="268" width="30" height="28" rx="4" fill="#dc2626"/>
    <rect x="110" y="258" width="5" height="18" rx="2" fill="#facc15"/>
    <!-- Reflective band -->
    <rect x="46" y="340" width="104" height="10" fill="#e5e7eb" opacity=".85"/>
    <!-- Tool belt -->
    <rect x="40" y="372" width="112" height="16" rx="3" fill="#78350f"/>
    <rect x="88" y="370" width="18" height="20" rx="3" fill="#d1d5db"/>
    <rect x="128" y="384" width="26" height="36" rx="4" fill="#92400e"/>
    <path d="M136 384V362M146 384V368" stroke="#9ca3af" stroke-width="5" stroke-linecap="round"/>

    <!-- Neck and head -->
    <rect x="84" y="196" width="24" height="32" rx="8" fill="#5b3420"/>
    <ellipse cx="98" cy="176" rx="36" ry="40" fill="#6b3e26"/>
    <path d="M132 170Q144 180 134 190" fill="#6b3e26"/>
    <ellipse cx="72" cy="180" rx="7" ry="11" fill="#5b3420"/>
    <ellipse cx="116" cy="170" rx="4" ry="5" fill="#111827"/>
    <path d="M108 160Q118 155 126 160" stroke="#1f1208" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M114 198Q122 202 130 198" stroke="#3b1f12" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Short beard -->
    <path d="M70 186Q76 216 100 218Q124 216 132 200Q120 208 104 206Q84 204 70 186Z" fill="#1f1208"/>
    <!-- Hard hat -->
    <path d="M60 156Q60 112 100 110Q140 112 140 156Z" fill="#facc15"/>
    <rect x="52" y="150" width="104" height="12" rx="6" fill="#eab308"/>
    <path d="M100 110V150" stroke="#eab308" stroke-width="8"/>

    <!-- Front arm reaching to the panel with a screwdriver -->
    <path d="M128 254C160 262 190 280 214 290" fill="none" stroke="#dc2626" stroke-width="32" stroke-linecap="round"/>
    <rect x="150" y="262" width="22" height="36" rx="4" fill="#16a34a" transform="rotate(20 161 280)"/>
    <circle cx="222" cy="292" r="14" fill="#6b3e26"/>
    <rect x="230" y="284" width="24" height="14" rx="5" fill="#15803d"/>
    <path d="M254 291H276" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
